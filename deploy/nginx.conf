# Put the htpasswd file outside the checkout:
#   sudo htpasswd -c /etc/nginx/maia.htpasswd <username>
limit_req_zone $binary_remote_addr zone=maia_api:10m rate=2r/s;

server {
    listen 80;
    server_name maia.fablelabs.no;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maia.fablelabs.no;

    # Certificate directives are managed by Certbot.
    auth_basic "Maia Human Move Explorer";
    auth_basic_user_file /etc/nginx/maia.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    client_max_body_size 32k;

    location /api/predict {
        limit_req zone=maia_api burst=3 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }
}


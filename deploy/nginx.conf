limit_req_zone $binary_remote_addr zone=maia_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=studio_login:10m rate=5r/m;

server {
    listen 80;
    server_name maia.fablelabs.no;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name maia.fablelabs.no;

    ssl_certificate /etc/letsencrypt/live/maia.fablelabs.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maia.fablelabs.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    client_max_body_size 256k;

    location = /studio {
        return 308 https://ggm.fablelabs.no/;
    }

    location /api/predict {
        limit_req zone=maia_api burst=3 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location /api/stockfish {
        limit_req zone=maia_api burst=3 nodelay;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location /api/portsmouth/play {
        limit_req zone=maia_api burst=3 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location /api/check-repertoire {
        client_max_body_size 2m;
        limit_req zone=maia_api burst=1 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location ~ ^/api/(parse-pgn|export-pgn)$ {
        client_max_body_size 8m;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location = /studio/api/login {
        limit_req zone=studio_login burst=3 nodelay;
        client_max_body_size 32k;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location ^~ /studio/api/ {
        # Staged uploads only: do not spool private media bodies to nginx disk.
        # Nested regex is evaluated within this existing ^~ Studio prefix.
        location ~ ^/studio/api/courses/[a-f0-9-]+/offline-video/uploads(?:/|$) {
            client_max_body_size 8m;
            client_body_timeout 30s;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 110s;
            proxy_read_timeout 110s;
            proxy_pass http://127.0.0.1:8310;
            include proxy_params;
        }
        client_max_body_size 2m;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8310;
        include proxy_params;
    }
}
